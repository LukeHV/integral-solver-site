<!doctype html><meta charset="utf-8"><title>tests</title>
<script src="js/cas.js"></script><script src="js/parse.js"></script><script src="js/integrate.js"></script><script src="js/solve.js"></script>
<pre id="o"></pre>
<script>
const cases = [
 'x^3+2x-5','1/x','sqrt(x)','e^(3x)','sin(2x)','sec^2 x','4/(1+x^2)','3^x','1/(2x+1)','(3x+1)^5',
 '2x cos(x^2)','x e^(x^2)','ln(x)/x','x/(x^2+1)','e^x/(1+e^(2x))','x^3 sqrt(x^2+1)','sin^3 x cos x','tan x','1/(x ln x)','x sqrt(x+1)','1/(1+sqrt x)','cos(sqrt x)/sqrt x',
 'x e^x','x^2 sin x','ln x','x ln x','e^x sin x','arctan x','x^2 e^(3x)','arcsin x','ln(x^2+1)','(ln x)^2','x sec^2 x','e^(2x) cos(3x)',
 '1/(x^2-1)','(3x+5)/(x^2+x-2)','(x^3+1)/(x^2-x)','1/(x(x+1)^2)','(x+1)/(x^2+2x+5)','1/(x^2+4x+13)','1/(1+e^x)','x/(x+1)','1/(x^3+x)','(2x+3)/(x^2+3x+5)','1/(x^2-2)','1/(x^2+1)^2',
 'sin^2 x','cos^3 x','tan^2 x','sin^2 x cos^2 x','sec^3 x','sin(3x)cos(2x)','sqrt(1-x^2)','1/(x^2 sqrt(4-x^2))','sqrt(1+x^2)','1/(1+x^2)^(3/2)','x^2/sqrt(1-x^2)','1/sqrt(4-x^2)','1/sqrt(x^2+9)','1/sqrt(x^2+2x+5)','sqrt(3-2x-x^2)','tan^3 x','sec^4 x','cos^4 x','sin^5 x','1/(sin x cos x)','cot^2 x','sin x / cos^2 x','tan x sec^3 x',
 'e^(-x^2)','sin(x)/x','x^x','|x|','sinh(2x)','cosh x sinh x','1/x^2','x^(-1/2)','(x+1)^2','x(x+1)^3','(e^x+e^(-x))^2','(x^2+1)/x','a x^2 + b','sin(a x)','dx','2^x 3^x','sin(2x)/sin x','cos(2x)/cos x',
 'log10 x','log2(x)','dx/x','sin theta dtheta','2e3x','tan x cos 2x',
 'sinh^3 x','cosh^3 x','1/(x^2+a^2)','sqrt(a^2-x^2)','1/sqrt(a^2-x^2)','1/(x^2+k^2)','tan x/(1+tan^2 x)','2^x 3^(2x)','sin(2x)^2/sin(x)^2',
 'x^8 e^x','x^8 sin x','x^10 e^(-x)',
 '1/(a^2-x^2)','1/(x^2-a^2)','1/sqrt(x^2+a^2)','1/sqrt(x^2-a^2)','sqrt(x^2+a^2)','sqrt(x^2-a^2)','tan x ln(cos x)','1/cosh x','sech(2x)',
 'sin(phi) dphi','x dalpha','sin(θ) dθ','xdx','x^2\\,dx','x^2 dx.','sech x tanh x'
];
// inputs that must be rejected with a message, not integrated
const rejects = ['1/0','ln(0)','x^(1/0)','x/(1-1)','1.5.2x','x + inf','x^2 + sin(','10^100 x','99999999999999999999 x','tan(pi/2) x','2e-3x','1,5x',
  'floor(x)','root(x)','foo(x)','ceil(x)','sgn(x)','Heaviside(x)','delta','e^x dx + 1','dx x','log_b(x)',
  '(-2)^x','(-1)^x','arcsec x','arccot(x)','arccsc x','arcsech x','arccoth x','tau','eta x','gamma(x)','dtau','x dxy'];
// the variable box: Greek symbols and names mean the same variable
const vcases = [['sin(θ)','θ','theta'],['sin(theta)','θ','theta'],['sin(θ)','theta','theta'],['sin(α)','alpha','alpha']];
const out=[]; let fails=0;
for (const c of cases){
  try{
    const t0=performance.now(); const r=SOLVE.solve({integrand:c,mode:'indefinite'}); const ms=(performance.now()-t0).toFixed(0);
    if(!r.F){fails++; out.push('FAIL  '+c+'   '+(r.timeout?'timeout':'')+' '+(r.nonElementary||'')+' '+ms+'ms');continue;}
    const okv = r.verify.ok?'ok ':'BAD';
    if(!r.verify.ok) fails++;
    out.push(okv+'  '+c+'  →  '+r.Ftext+'   ['+ms+'ms] '+JSON.stringify([r.verify.good,r.verify.bad]));
  }catch(e){fails++; out.push('ERR   '+c+'  '+e.message+'\n'+e.stack.split('\n').slice(0,3).join('\n'));}
}
for (const [c,v,want] of vcases){
  try{ const r=SOLVE.solve({integrand:c,mode:'indefinite',variable:v}); const good=r.F&&r.verify.ok&&r.x===want&&!r.params.length; if(!good) fails++;
    out.push((good?'ok ':'BAD')+'  '+c+' d'+v+'  →  '+(r.F?r.Ftext:'-')+'  (variable '+r.x+')'); }
  catch(e){fails++; out.push('ERR   '+c+' d'+v+'  '+e.message);}
}
for (const c of rejects){
  try{ SOLVE.solve({integrand:c,mode:'indefinite'}); fails++; out.push('BAD  '+c+'  →  accepted, should be an error'); }
  catch(e){ out.push((e instanceof PARSE.ParseError?'ok ':'ERR')+'  '+c+'  →  '+e.message); if(!(e instanceof PARSE.ParseError)) fails++; }
}
const defs=[['x sin x','0','pi'],['e^(-x)','0','inf'],['ln x','0','1'],['1/x^2','1','inf'],['1/(1+x^2)','-inf','inf'],['1/sqrt(x)','0','1'],['sqrt(4-x^2)','0','2'],['1/x^2','-1','1'],['e^(-x^2)','0','1'],['x^2','0','3'],['sin^2 x','0','pi/2'],['1/x','0','1'],['sin(x)/x','0','pi'],['ln x','-1','1'],['1/(x^2-1)','2','3'],['x e^(-x)','0','inf'],['1/x^(1/3)','-1','1'],
  ['tan x','0','pi/2'],['sin(x)/x','0','inf'],['cos x','0','inf'],['ln(x)/sqrt(x)','0','1'],['1/x^(2/3)','-1','1'],['1/sqrt(1-x^2)','-1','1'],['cos(x)/x','1','inf'],['1/(1+e^x)','0','inf'],
  ['ln x','0','inf'],['1','0','inf'],['x','0','inf'],['x','0','+inf'],['atan x','0','inf'],['atan x','-inf','inf'],['sec^2 x','0','pi/2'],['sec^2 x','0','pi'],['1/(x-1)^2','1','2'],['1/(x-1)^2','0','2'],['1/(x ln(x)^2)','1','2'],['x','inf','inf'],['x','inf','0'],
  ['1/(x ln(x)^2)','2','inf'],['1/(x ln(x)^2)','e','inf'],['1/(x ln(x)^3)','2','inf'],['1/ln(x)','2','inf'],
  ['(1-cos x)/x^2','0','inf'],['(sin x/x)^2','0','inf'],['sin^2 x/x^2','-inf','inf'],['x^(-1.01)','1','inf'],['sin(100x)/x','0','inf'],
  ['e^(-1/x)/x^2','0','1'],['x','0','1e3'],
  ['e^x/x','0','1'],['cos x/x','0','1'],['sin x/x^2','0','1'],['1/ln x','1','2'],['(1/x) sin(1/x)','0','1'],['sin x/x','0','1e6'],['sin(x^2)','0','100'],['sin(1/x)','0','1'],
  ['e^x','0','inf'],['e^x','-inf','inf'],['2^x','0','inf'],['cosh x','0','inf'],['e^(-x)','-inf','0'],['x e^(-x)','-inf','inf'],['e^(1/x)/x^2','0','1'],['e^(1/x)/x^2','-1','1'],
  ['e^(-x)','0','1e9'],['e^(-x)','0','1e14'],['x e^(-x)','0','1e14'],['e^(-x^2)','0','1e14'],
  ['(1-x)^(-0.9)','0','1'],['abs(x-1)^(-0.75)','0','2'],['x^10 e^(-x)','0','inf'],
  ['e^x','0','1000'],['e^x','1000','0'],['e^(-x)','-800','0'],['e^(x^2)','0','100'],['x^50','0','1e9'],['e^x/x','1','800'],['sinh x','0','800'],['2^x','0','2000'],['e^x + 1/(x-900)^2','0','1000'],
  ['e^(-x)/x^2','0','inf'],['cos x/x','0','inf'],['e^(-x)/x','0','inf'],['e^x/x^2','-inf','0']];
for(const [f,a,b] of defs){
  try{ const r=SOLVE.solve({integrand:f,mode:'definite',lower:a,upper:b});
   out.push('DEF '+f+' ['+a+','+b+']  exact='+(r.value?CAS.txt(r.value.e)+' ≈'+r.value.v:'-')+' num='+(r.numeric?r.numeric.value+(r.numeric.ok?'':' (?)'):'-')+(r.diverges?' DIVERGES':'')+(r.oscillates?' OSC':'')+(r.conditional?' COND':'')+(r.limitUnsettled?' NUMERIC':'')+(r.undecided?' UNDECIDED':'')+(r.roughNumeric?' ROUGH':'')+(r.extrapolated?' EXTRAP':'')+(r.numeric&&!r.diverges&&r.numeric.error>1e-9*(1+Math.abs(r.numeric.value))?' ±'+r.numeric.error.toPrecision(2):'')+(r.undefinedPart?' UNDEF':'')+(r.value&&r.value.mismatch?' MISMATCH':'')+(r.tooLarge?' TOOLARGE '+r.tooLarge.text+(r.tooLarge.exactText?' = '+r.tooLarge.exactText:''):'')+' sing='+JSON.stringify(r.singular));
  }catch(e){out.push('DEFERR '+f+' '+e.message+'\n'+e.stack.split('\n').slice(0,3).join('\n'));}
}
out.unshift('fails: '+fails+' / '+(cases.length+rejects.length+vcases.length));
document.getElementById('o').textContent=out.join('\n');
</script>
<pre id="s"></pre>
<script>
function dump(st, d=0){ let s=''; const pad='  '.repeat(d); s+=pad+'['+st.rule+']\n'; for(const it of st.items){ if(it.p) s+=pad+'  P: '+it.p+'\n'; if(it.m) s+=pad+'  M: '+it.m+'\n'; if(it.s) s+=dump(it.s,d+1);} return s;}
let so='';
for (const c of ['e^x sin x','1/(x(x+1)^2)','sqrt(1-x^2)','x^3 sqrt(x^2+1)','(x+1)/(x^2+2x+5)']) { const r=SOLVE.solve({integrand:c}); so+='=== '+c+'\n'+(r.step?dump(r.step):'none')+'\n'; }
document.getElementById('s').textContent=so;
</script>
